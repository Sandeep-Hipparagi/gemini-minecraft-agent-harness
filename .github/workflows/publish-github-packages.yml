name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish package to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sandeep-hipparagi'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests (skip format check due to pre-existing style)
        run: npm run lint && npm test

      - name: Publish @sandeep-hipparagi/gemini-minecraft-agent-harness
        run: |
          # Temporarily rewrite name for GitHub Packages and remove private field
          npm pkg set name="@sandeep-hipparagi/gemini-minecraft-agent-harness"
          npm pkg delete private
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}